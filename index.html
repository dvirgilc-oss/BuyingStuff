<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחלקת הרכש המשפחתית 🛍️</title>
<style>
  :root{
    --pink: #e8b4c0;
    --pink-dark: #c98ea0;
    --gold: #d4a94c;
    --cream: #fdf6f0;
    --ink: #3a2c2f;
    --green: #4c8c6b;
    --red: #c65b5b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, var(--cream) 0%, #fbeee6 100%);
    color: var(--ink);
  }
  header.hero{
    text-align:center;
    padding: 40px 16px 30px;
    background: linear-gradient(160deg, var(--pink) 0%, var(--pink-dark) 100%);
    color: white;
    border-radius: 0 0 40px 40px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .hero img{
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid white;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .hero h1{
    font-size: 1.8rem;
    margin: 16px 0 4px;
  }
  .hero p.president{
    font-size: 1.1rem;
    font-weight: 800;
    margin: 0 0 8px;
    color: var(--gold);
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
  .hero p.caption{
    font-size: 0.95rem;
    opacity: 0.95;
    max-width: 480px;
    margin: 0 auto;
  }
  main{
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  .counter-box{
    background: white;
    border: 2px dashed var(--gold);
    border-radius: 18px;
    padding: 16px;
    text-align:center;
    margin-bottom: 24px;
  }
  .counter-box .num{
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--pink-dark);
  }
  .counter-box .label{
    font-size: 0.85rem;
    color: #7a6a6d;
  }
  .cta-btn{
    display:block;
    width:100%;
    padding: 18px;
    font-size: 1.15rem;
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, var(--pink-dark), var(--gold));
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(201,142,160,0.4);
    transition: transform 0.15s ease;
  }
  .cta-btn:active{ transform: scale(0.97); }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin: 18px 0 26px;
